; 配置唯一位置：MHGU 当前用户的存档根目录 /attack_damage_display.ini
; Forge → Plugin UI → 本插件中编辑，点击 Save INI 保存到同一文件。
; MHGU Attack Damage Display v0.5
; 菜单外观实时预览；更换字体文件、手动编辑 INI 后重启。
; 掌机/主机画面宽高自动读取，无需填写分辨率或坐标偏移。
; 字号和描边宽度以 720p 为基准；颜色写 #RRGGBBAA，最后两位是透明度。

[display]
enabled = true

; 基础字号，允许 8～128。例如改为 42.0 可增大数字。
font_size = 34.0

; default 使用 Forge 默认字体。
; 使用专用字体时填 TTF 文件名，例如 font_file = MyFont.ttf
; 并把字体放入 romfs/nativeNX/forge/fonts/，只影响本插件。
font_file = default

; 肉质 ≥45 和无视物理肉质伤害，默认黄色。
highlight_color = #FFDC50FF
; 肉质 <45，默认白色。
normal_color = #FFFFFFFF
; 描边颜色和宽度；宽度允许 0～10，0 关闭描边。
outline_color = #0A0A0AFF
outline_width = 2.0

; 单位为秒，保持 0 < full_opacity < lifetime <= 60。
; 前 1.10 秒完全不透明，最后 0.30 秒淡出。
full_opacity = 1.10
lifetime = 1.40
